name: Selective Promote Dev → UAT

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that was merged into dev (feature → dev)"
        required: true
        type: string
      selected_commits:
        description: "Comma-separated commit SHAs to cherry-pick into UAT (empty = discovery mode)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  workflows: write

jobs:
  get-pr-commits:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      commit_list: ${{ steps.get_commits.outputs.commit_list }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch commit list for PR
        id: get_commits
        run: |
          echo "Fetching commits for PR #${{ github.event.inputs.pr_number }}"

          # Fetch PR commit SHAs and messages
          commits=$(gh pr view ${{ github.event.inputs.pr_number }} --json commits --jq '.commits[] | .oid + "___" + .messageHeadline')

          echo "commit_list<<EOF" >> $GITHUB_OUTPUT
          echo "$commits" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Add commit list to summary
        run: |
          {
            echo "## Commits in PR #${{ github.event.inputs.pr_number }}"
            echo ""
            echo "| SHA | Message |"
            echo "|-----|---------|"
            while IFS= read -r line; do
              sha="${line%%___*}"
              msg="${line#*___}"
              echo "| \`$sha\` | $msg |"
            done <<< "${{ steps.get_commits.outputs.commit_list }}"
          } >> $GITHUB_STEP_SUMMARY

      - name: Display commits
        run: |
          echo "### Commits found in PR #${{ github.event.inputs.pr_number }}:"
          while IFS= read -r line; do
            sha="${line%%___*}"
            msg="${line#*___}"
            echo "$sha - $msg"
          done <<< "${{ steps.get_commits.outputs.commit_list }}"
          echo ""
          echo "ℹ️ Re-run the workflow and fill 'selected_commits' with the SHAs you want to cherry-pick."

  cherry_pick:
    needs: get-pr-commits
    if: ${{ github.event.inputs.selected_commits != '' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout UAT
        uses: actions/checkout@v4
        with:
          ref: uat
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Create release branch
        id: release
        run: |
          release_branch="release-uat-${{ github.run_id }}"
          git checkout -b "$release_branch"
          echo "release_branch=$release_branch" >> $GITHUB_OUTPUT

      - name: Cherry-pick commits
        run: |
          echo "Cherry-picking: ${{ github.event.inputs.selected_commits }}"
          IFS=',' read -ra COMMITS <<< "${{ github.event.inputs.selected_commits }}"
          for commit in "${COMMITS[@]}"; do
            echo "Applying $commit..."
            git cherry-pick "$commit" || exit 1
          done

      - name: Push release branch
        run: |
          git push origin "${{ steps.release.outputs.release_branch }}"

      - name: Create PR to UAT
        run: |
          gh pr create \
            --title "Promote selected commits to UAT" \
            --body "Commits: ${{ github.event.inputs.selected_commits }}" \
            --base uat \
            --head "${{ steps.release.outputs.release_branch }}"
